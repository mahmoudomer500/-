name: Arabic Compiler CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Windows (MinGW)
  # ══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install MinGW64
      run: |
        choco install mingw -y --no-progress
        Write-Host "##[group]Verify g++"
        g++ --version
        Write-Host "##[endgroup]"

    - name: Build Compiler
      run: |
        $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;$env:PATH"
        New-Item -ItemType Directory -Force -Path build_release/Release | Out-Null
        # Exclude files by name (not full path) that depend on missing implementations
        $excludeNames = @("ArabicAppsAPI.cpp", "ArabicNetwork.cpp", "ArabicGUI.cpp", "ArabicVisionBridge.cpp", "ArabicTextClassifier.cpp", "WindowManager_stub.cpp", "ArabicVisionBridge_stub.cpp")
        $cppFiles = Get-ChildItem -Path src/core,src/runtime,src/stdlib,src/utils/core,src/utils/debug,src/modules/core -Recurse -Filter "*.cpp" |
          Where-Object { $excludeNames -notcontains $_.Name } |
          Select-Object -ExpandProperty FullName
        # Add ArabicComputerVision.cpp for WindowManager::pumpMessages()
        $cppFiles += "src/modules/ai/ArabicComputerVision.cpp"
        $cppFiles += "src/main.cpp"
        Write-Host "Compiling $($cppFiles.Count) files..."
        $includeDirs = @(
          "-Isrc/core", "-Isrc/include", "-Isrc/runtime",
          "-Isrc/modules", "-Isrc/modules/ui", "-Isrc/modules/graphics",
          "-Isrc/modules/ai", "-Isrc/modules/core",
          "-Isrc/utils/core", "-Isrc/utils/debug",
          "-Isrc/stdlib", "-Isrc/stdlib/io", "-Isrc/stdlib/math",
          "-Isrc/stdlib/collections", "-Isrc/api"
        )
        $includes = $includeDirs -join " "
        $cppList = ($cppFiles | ForEach-Object { "`"$_`"" }) -join " "
        $cmd = "g++ -std=c++17 -O2 -D_CRT_SECURE_NO_WARNINGS -finput-charset=UTF-8 -fexec-charset=UTF-8 $includes $cppList -o build_release/Release/arabic_compiler.exe -lgdiplus -lole32 -loleaut32 -lstrmiids -luuid -luser32 -lgdi32 -lshell32 -lcomdlg32 -lws2_32 2>&1"
        Write-Host "Running: g++ ..."
        Invoke-Expression $cmd
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Write-Host "Build successful!"
        Get-ChildItem build_release/Release/*.exe | Format-Table Name, Length
      shell: pwsh

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-windows
        path: build_release/Release/arabic_compiler.exe
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Linux
  # ══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ build-essential

    - name: Build Compiler
      run: |
        mkdir -p build_release/Release
        echo "Compiling..."
        # Build file list - exclude Windows-only files
        FILES="src/main.cpp src/core/ArabicVisionBridge_stub.cpp src/modules/ai/WindowManager_stub.cpp"
        for dir in src/core src/runtime src/stdlib src/modules/core src/modules/ai src/utils/core src/utils/debug; do
          for f in $dir/*.cpp; do
            [ -f "$f" ] || continue
            case "$f" in
              *ArabicNetwork*|*ArabicAppsAPI*|*ArabicGUI*|*ArabicVisionBridge_stub*) continue ;;
              *ArabicLinker*|*ArabicText*|*ArabicTextUtils*) continue ;;
              *ArabicArraySIMD*|*WindowManager_stub*) continue ;;
              *ArabicRuntime*) continue ;;
              *ArabicProfiler*) continue ;;
            esac
            FILES="$FILES $f"
          done
        done
        echo "Files: $FILES"
        echo ""
        g++ -std=c++17 -O2 -D_CRT_SECURE_NO_WARNINGS \
          -finput-charset=UTF-8 -fexec-charset=UTF-8 \
          -Isrc/core -Isrc/include -Isrc/runtime \
          -Isrc/modules -Isrc/modules/core -Isrc/modules/ai \
          -Isrc/utils/core -Isrc/utils/debug \
          -Isrc/stdlib -Isrc/stdlib/io -Isrc/stdlib/math -Isrc/stdlib/collections \
          -Isrc/api \
          $FILES \
          -o build_release/Release/arabic_compiler \
          -lpthread -ldl 2>&1
        echo "Exit code: $?"
        ls -la build_release/Release/
      shell: bash

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-linux
        path: build_release/Release/arabic_compiler
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # فحص جودة الكود
  # ══════════════════════════════════════════════════════════════
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Run basic checks
      run: |
        echo "Checking file structure..."
        echo "Source files:"
        find src -name "*.cpp" -o -name "*.h" | wc -l
        echo ""
        echo "Example files:"
        find examples -name "*.عربي" 2>/dev/null | wc -l

    - name: Check for security issues
      run: |
        echo "Basic security checks..."
        # Just warn, don't fail
        if grep -r "system(" src/ 2>/dev/null; then
          echo "::warning::Found system() calls - review recommended"
        fi
        echo "Check complete."
