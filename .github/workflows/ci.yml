name: Arabic Compiler CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Windows (MinGW)
  # ══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install MinGW64
      run: |
        choco install mingw --version=15.2.0 -y
        $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;$env:PATH"
        g++ --version

    - name: Build Compiler
      run: |
        $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;$env:PATH"
        $includeDirs = @(
          "-Isrc/core", "-Isrc/include", "-Isrc/runtime",
          "-Isrc/modules", "-Isrc/modules/ui", "-Isrc/modules/graphics",
          "-Isrc/modules/ai", "-Isrc/modules/core",
          "-Isrc/utils/core", "-Isrc/utils/debug",
          "-Isrc/stdlib", "-Isrc/stdlib/io", "-Isrc/stdlib/math",
          "-Isrc/stdlib/collections", "-Isrc/api"
        )
        $cppFiles = @(
          "src/main.cpp",
          (Get-ChildItem -Path src/core -Filter "*.cpp" | Select-Object -ExpandProperty FullName),
          (Get-ChildItem -Path src/runtime -Filter "*.cpp" | Select-Object -ExpandProperty FullName),
          (Get-ChildItem -Path src/stdlib -Filter "*.cpp" | Select-Object -ExpandProperty FullName),
          (Get-ChildItem -Path src/modules/core -Filter "*.cpp" | Select-Object -ExpandProperty FullName),
          (Get-ChildItem -Path src/utils/core -Filter "*.cpp" | Select-Object -ExpandProperty FullName),
          (Get-ChildItem -Path src/utils/debug -Filter "*.cpp" | Select-Object -ExpandProperty FullName)
        )
        $args = @("-std=c++17", "-O2", "-D_CRT_SECURE_NO_WARNINGS",
                  "-finput-charset=UTF-8", "-fexec-charset=UTF-8") +
                $includeDirs + $cppFiles +
                @("-o", "build_release/Release/arabic_compiler.exe",
                  "-lgdiplus", "-lole32", "-loleaut32", "-lstrmiids", "-luuid",
                  "-luser32", "-lgdi32", "-lshell32", "-lcomdlg32", "-lws2_32")
        & g++ $args
      shell: pwsh

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-windows
        path: build_release/Release/arabic_compiler.exe
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Linux
  # ══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake build-essential

    - name: Build Compiler
      run: |
        mkdir -p build_release/Release
        # Collect source files (exclude Windows-specific)
        SRC_FILES=$(find src/main.cpp src/core src/runtime src/stdlib src/modules/core src/utils/core src/utils/debug \
          -name "*.cpp" 2>/dev/null | grep -v "ArabicNetwork\|ArabicAppsAPI\|ArabicGUI")
        INCLUDES="-Isrc/core -Isrc/include -Isrc/runtime -Isrc/modules -Isrc/modules/core \
          -Isrc/utils/core -Isrc/utils/debug -Isrc/stdlib -Isrc/stdlib/io -Isrc/stdlib/math \
          -Isrc/stdlib/collections -Isrc/api"
        g++ -std=c++17 -O2 -D_CRT_SECURE_NO_WARNINGS \
          -finput-charset=UTF-8 -fexec-charset=UTF-8 \
          $INCLUDES $SRC_FILES \
          -o build_release/Release/arabic_compiler \
          -lpthread -ldl
      shell: bash

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-linux
        path: build_release/Release/arabic_compiler
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # فحص جودة الكود
  # ══════════════════════════════════════════════════════════════
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Run basic checks
      run: |
        echo "Checking file structure..."
        echo "Source files:"
        find src -name "*.cpp" -o -name "*.h" | wc -l
        echo ""
        echo "Example files:"
        find examples -name "*.عربي" 2>/dev/null | wc -l

    - name: Check for security issues
      run: |
        echo "Basic security checks..."
        if grep -r "system(" src/ 2>/dev/null; then
          echo "::warning::Found system() calls - ensure proper sanitization"
        fi
