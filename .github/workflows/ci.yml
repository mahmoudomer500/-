name: Arabic Compiler CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Windows (MinGW)
  # ══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install MinGW64
      run: |
        choco install mingw -y --no-progress
        Write-Host "##[group]Verify g++"
        g++ --version
        Write-Host "##[endgroup]"

    - name: Build Compiler
      run: |
        $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;$env:PATH"
        New-Item -ItemType Directory -Force -Path build_release/Release | Out-Null
        # All files are now fixed - compile everything
        $excludeNames = @()
        $cppFiles = Get-ChildItem -Path src/core,src/runtime,src/stdlib,src/utils/core,src/utils/debug,src/modules/core,src/modules/ai -Recurse -Filter "*.cpp" |
          Where-Object { $excludeNames -notcontains $_.Name } |
          Select-Object -ExpandProperty FullName
        $cppFiles += "src/main.cpp"
        # Normalize paths and deduplicate
        $cppFiles = $cppFiles | ForEach-Object { $_.Replace('\', '/').Replace('//', '/') } | Sort-Object -Unique
        Write-Host "Files to compile: $($cppFiles.Count)"
        Write-Host "Compiling $($cppFiles.Count) files..."
        $includeDirs = @(
          "-Isrc/core", "-Isrc/include", "-Isrc/runtime",
          "-Isrc/modules", "-Isrc/modules/ui", "-Isrc/modules/graphics",
          "-Isrc/modules/ai", "-Isrc/modules/core",
          "-Isrc/utils/core", "-Isrc/utils/debug",
          "-Isrc/stdlib", "-Isrc/stdlib/io", "-Isrc/stdlib/math",
          "-Isrc/stdlib/collections", "-Isrc/api"
        )
        $includes = $includeDirs -join " "
        $cppList = ($cppFiles | ForEach-Object { "`"$_`"" }) -join " "
        $cmd = "g++ -std=c++17 -O2 -D_CRT_SECURE_NO_WARNINGS -finput-charset=UTF-8 -fexec-charset=UTF-8 $includes $cppList -o build_release/Release/arabic_compiler.exe -lgdiplus -lole32 -loleaut32 -lstrmiids -luuid -luser32 -lgdi32 -lshell32 -lcomdlg32 -lws2_32 -lwinhttp -lcomctl32 2>&1"
        Write-Host "Running: g++ ..."
        Invoke-Expression $cmd
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Write-Host "Build successful!"
        Get-ChildItem build_release/Release/*.exe | Format-Table Name, Length
      shell: pwsh

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-windows
        path: build_release/Release/arabic_compiler.exe
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Linux (معطل مؤقتاً - المشروع Windows-only)
  # ══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    if: false  # Disabled - project uses Windows-specific APIs

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Skip
      run: echo "Linux build disabled - project uses Windows-specific APIs (WinHTTP, Win32 Console, GDI)"

  # ══════════════════════════════════════════════════════════════
  # فحص جودة الكود
  # ══════════════════════════════════════════════════════════════
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Run basic checks
      run: |
        echo "Checking file structure..."
        echo "Source files:"
        find src -name "*.cpp" -o -name "*.h" | wc -l
        echo ""
        echo "Example files:"
        find examples -name "*.عربي" 2>/dev/null | wc -l

    - name: Check for security issues
      run: |
        echo "Basic security checks..."
        # Just warn, don't fail
        if grep -r "system(" src/ 2>/dev/null; then
          echo "::warning::Found system() calls - review recommended"
        fi
        echo "Check complete."
