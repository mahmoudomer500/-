name: Arabic Compiler CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  COMPILER_VERSION: "1.0.0-beta"

jobs:
  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Windows
  # ══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build with MSVC
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        cmake --build . --config ${{ env.BUILD_TYPE }}
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-windows
        path: |
          build/Release/*.exe
          build/Release/*.dll
        retention-days: 30
    
    - name: Test basic compilation
      run: |
        $exe = Get-ChildItem -Path build/Release -Filter "*.exe" | Select-Object -First 1
        if ($exe) {
          Write-Host "Testing: $($exe.Name)"
          & $exe.FullName --version
        }

  # ══════════════════════════════════════════════════════════════
  # اختبار البناء على Linux
  # ══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake build-essential
    
    - name: Build with GCC
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        cmake --build . --config ${{ env.BUILD_TYPE }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arabic-compiler-linux
        path: build/*
        retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # اختبار Bootstrap
  # ══════════════════════════════════════════════════════════════
  bootstrap-test:
    runs-on: windows-latest
    needs: build-windows
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: arabic-compiler-windows
        path: output/
    
    - name: List files
      run: Get-ChildItem -Path output/
    
    - name: Run Bootstrap Test
      run: |
        if (Test-Path "output/*.exe") {
          $exe = Get-ChildItem -Path output -Filter "*.exe" | Select-Object -First 1
          Write-Host "Testing bootstrap with: $($exe.Name)"
          
          # Test self-hosting components
          if (Test-Path "self_hosted_output/*.exe") {
            Write-Host "Testing self-hosted components..."
            Get-ChildItem -Path "self_hosted_output/" -Filter "*.exe"
          }
        }

  # ══════════════════════════════════════════════════════════════
  # فحص جودة الكود
  # ══════════════════════════════════════════════════════════════
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Run basic checks
      run: |
        echo "Checking file structure..."
        echo "Source files:"
        find src -name "*.cpp" -o -name "*.h" | head -20
        echo ""
        echo "Example files:"
        find examples -name "*.عربي" | wc -l
        
    - name: Check for security issues
      run: |
        echo "Basic security checks..."
        # Check for common issues
        if grep -r "system(" src/ 2>/dev/null; then
          echo "⚠️ Found system() calls - ensure proper sanitization"
        fi

  # ══════════════════════════════════════════════════════════════
  # إنشاء Release
  # ══════════════════════════════════════════════════════════════
  release:
    runs-on: windows-latest
    needs: [build-windows, bootstrap-test]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release Package
      run: |
        mkdir release
        Copy-Item -Path "arabic-compiler-windows/*" -Destination release/
        Copy-Item -Path "self_hosted_output/*" -Destination release/ -ErrorAction SilentlyContinue
        Copy-Item -Path "examples/*" -Destination release/examples/ -Recurse -ErrorAction SilentlyContinue
        
        Compress-Archive -Path release/* -DestinationPath "ArabicCompiler-${{ env.COMPILER_VERSION }}-win.zip"
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ArabicCompiler-${{ env.COMPILER_VERSION }}-win.zip
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
